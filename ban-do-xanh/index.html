<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16A34A">
<meta name="description" content="Bản đồ Xanh — Cộng đồng ghi nhận và theo dõi ô nhiễm môi trường trên bản đồ mở OpenStreetMap.">
<title>Bản đồ Xanh — Ghi nhận &amp; theo dõi ô nhiễm môi trường</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="preconnect" href="https://images.weserv.nl" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="map" aria-label="Bản đồ ô nhiễm môi trường">
    <div id="mapEl" aria-hidden="true"></div>

    <!-- Trạng thái tải / lỗi bản đồ -->
    <div id="mapStatus" class="map-status" role="status">
      <div class="map-status-card">
        <div class="spinner" aria-hidden="true"></div>
        <p id="mapStatusText">Đang tải bản đồ…</p>
        <button id="retryMapBtn" class="btn btn-primary" hidden>Thử lại</button>
      </div>
    </div>

    <!-- Thanh trên: tìm kiếm + bộ lọc -->
    <header id="topBar">
      <div class="search-row">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          </span>
          <input id="searchInput" type="search" placeholder="Tìm địa điểm, loại ô nhiễm…" autocomplete="off" aria-label="Tìm kiếm báo cáo hoặc địa điểm">
          <button id="clearSearchBtn" class="icon-btn" hidden aria-label="Xóa tìm kiếm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <button id="themeBtn" class="round-btn" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện (T)">
          <svg class="ic-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
          <svg class="ic-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="filterToggleBtn" class="round-btn" aria-expanded="false" aria-controls="filterPanel" aria-label="Bộ lọc" title="Bộ lọc (F)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>
        </button>
        <button id="heatToggleBtn" class="round-btn" aria-pressed="false" aria-label="Chế độ xem nhiệt" title="Xem nhiệt (H)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s5 4.5 5 9a5 5 0 0 1-10 0c0-1.5.5-2.9 1.2-4C8.7 8.6 9.5 10 11 10c-.6-2.8.2-6 1-8z"/><path d="M12 22a7 7 0 0 0 7-7c0-1.2-.3-2.4-.8-3.5"/></svg>
        </button>
      </div>

      <div id="resultRow" class="result-row" hidden>
        <span id="resultText" role="status"></span>
        <button id="clearResultBtn" class="icon-btn" aria-label="Đóng kết quả">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <section id="filterPanel" class="filter-panel" hidden aria-label="Bộ lọc hiển thị">
        <div class="filter-group">
          <span class="filter-label">Loại ô nhiễm</span>
          <div id="filterTypes" class="chips"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Mức độ</span>
          <div id="filterLevels" class="chips"></div>
        </div>
        <div class="filter-group">
          <span class="filter-label">Nguồn</span>
          <div id="filterSources" class="chips"></div>
        </div>
        <button id="resetFiltersBtn" class="btn btn-ghost btn-sm">Đặt lại bộ lọc</button>
      </section>
    </header>

    <!-- Chú thích + nút định vị -->
    <div id="legendBar">
      <div id="legend" class="legend" role="list" aria-label="Chú thích mức độ khẩn cấp"></div>
      <button id="locateBtn" class="locate-btn" aria-label="Về vị trí của tôi" title="Vị trí của tôi (L)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/><circle cx="12" cy="12" r="9" opacity=".35"/></svg>
      </button>
    </div>

    <!-- Nút camera lớn giữa dưới -->
    <button id="addFab" class="add-fab" aria-haspopup="dialog" title="Ghi nhận ô nhiễm (A)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7.8 6.2a2 2 0 0 1-1.6.8H4a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2.2a2 2 0 0 1-1.6-.8L14.5 4z"/><circle cx="12" cy="13" r="3.6"/></svg>
      <span>Chụp ô nhiễm</span>
    </button>

    <!-- Cảm biến hoạt động -->
    <div id="sensorPill" class="sensor-pill" role="status"></div>
  </div>
</div>

<!-- Thẻ ảnh nhỏ cạnh chấm (popover) -->
<div id="reportCard" class="report-card" hidden role="dialog" aria-modal="false" aria-labelledby="rcTitle">
  <div class="rc-photo-wrap">
    <img id="rcPhoto" alt="" loading="lazy">
    <span id="rcLevelBadge" class="rc-level"></span>
  </div>    <div class="rc-body">
      <div class="rc-head">
        <h3 id="rcTitle"></h3>
        <button id="rcClose" class="icon-btn" aria-label="Đóng thẻ báo cáo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p id="rcMeta" class="rc-meta"></p>
      <p id="rcDesc" class="rc-desc"></p>
      <button id="rcDetailBtn" class="btn btn-ghost btn-sm rc-detail-btn">Xem chi tiết &amp; thảo luận →</button>
      <div class="rc-foot">
        <span id="rcSource" class="rc-source"></span>
        <span id="rcTime" class="rc-time"></span>
      </div>
    </div>
</div>

<!-- Dialog thêm báo cáo -->
<div id="addDialog" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Ghi nhận ô nhiễm</h2>
      <button id="sheetClose" class="icon-btn" aria-label="Đóng">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <form id="addForm" novalidate>
      <button type="button" id="photoBtn" class="photo-pick" aria-label="Chụp hoặc chọn ảnh">
        <img id="photoPreview" alt="" hidden>
        <div id="photoPlaceholder" class="photo-placeholder">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7.8 6.2a2 2 0 0 1-1.6.8H4a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2.2a2 2 0 0 1-1.6-.8L14.5 4z"/><circle cx="12" cy="13" r="3.6"/></svg>
          <span>Chụp / chọn ảnh</span>
        </div>
        <button type="button" id="photoRemoveBtn" class="photo-remove icon-btn" hidden aria-label="Xóa ảnh đã chọn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </button>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>

      <div class="field">
        <span class="field-label" id="lblType">Loại ô nhiễm</span>
        <div id="typeGrid" class="type-grid" role="radiogroup" aria-labelledby="lblType"></div>
      </div>

      <div class="field">
        <span class="field-label" id="lblLevel">Mức độ khẩn cấp</span>
        <div id="levelGrid" class="level-grid" role="radiogroup" aria-labelledby="lblLevel"></div>
      </div>

      <div class="field">
        <label class="field-label" for="descInput">Mô tả ngắn</label>
        <textarea id="descInput" rows="2" maxlength="280" placeholder="Ví dụ: Rác thải nhựa nổi trên kênh, bốc mùi nặng…"></textarea>
        <span class="char-count"><span id="descCount">0</span>/280</span>
      </div>

      <p id="locStatus" class="loc-status" role="status">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span id="locStatusText">Đang lấy vị trí GPS…</span>
      </p>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-lg" disabled>
        <span class="btn-label">Gửi báo cáo</span>
        <span class="btn-spinner" hidden aria-hidden="true"></span>
      </button>
    </form>
  </div>
</div>

<!-- Sheet chi tiết + thảo luận cộng đồng -->
<div id="detailOverlay" class="overlay" hidden>
  <div class="sheet detail-sheet" role="dialog" aria-modal="true" aria-labelledby="dtTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="dtTitle">Chi tiết báo cáo</h2>
      <button id="dtClose" class="icon-btn" aria-label="Đóng chi tiết">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div id="dtPhotoWrap" class="dt-photo" hidden><img id="dtPhoto" alt=""></div>

    <div class="dt-badges">
      <span id="dtLevel" class="rc-level static"></span>
      <span id="dtType" class="dt-type"></span>
      <span id="dtSource" class="rc-source"></span>
      <span id="dtTime" class="rc-time"></span>
    </div>
    <p id="dtDesc" class="dt-desc"></p>

    <div class="dt-actions">
      <button id="confirmBtn" class="confirm-btn" aria-pressed="false">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>
        <span id="confirmCount">0 xác nhận</span>
      </button>
      <span class="dt-hint">Xác nhận giúp báo cáo đáng tin hơn</span>
    </div>

    <section class="dt-comments" aria-label="Thảo luận cộng đồng">
      <h3 id="commentsHeader">Thảo luận</h3>
      <ul id="commentList" class="comment-list"></ul>
      <form id="commentForm" class="comment-form">
        <input id="commentInput" type="text" maxlength="300" placeholder="Thêm bình luận của bạn…" aria-label="Bình luận của bạn" autocomplete="off">
        <button type="submit" class="btn btn-primary btn-sm">Gửi</button>
      </form>
    </section>
  </div>
</div>

<input type="file" id="importInput" accept="application/json" hidden>
<div id="toastHost" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js" crossorigin=""></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
